services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_DATABASE: exploding_kitty
      MYSQL_USER: exploding_kitty
      MYSQL_PASSWORD: exploding_kitty
      MYSQL_ROOT_PASSWORD: local-root-password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    ports:
      - "3306:3306"
    volumes:
      - exploding-kitty-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uexploding_kitty -pexploding_kitty --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ../..
      dockerfile: apps/game-server/Dockerfile
    environment:
      NODE_ENV: development
      MYSQL_ADDRESS: mysql:3306
      MYSQL_USERNAME: exploding_kitty
      MYSQL_PASSWORD: exploding_kitty
      MYSQL_DATABASE: exploding_kitty
      AUTH_SECRET: local-compose-auth-secret-change-before-production
      DEV_AUTH_ENABLED: "true"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  exploding-kitty-mysql:
