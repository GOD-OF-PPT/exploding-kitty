services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: exploding_kitty
      POSTGRES_USER: exploding_kitty
      POSTGRES_PASSWORD: exploding_kitty
    ports:
      - "5432:5432"
    volumes:
      - exploding-kitty-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exploding_kitty"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: apps/game-server/Dockerfile
    environment:
      DATABASE_URL: postgres://exploding_kitty:exploding_kitty@postgres:5432/exploding_kitty
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/persistence/migrate.js"]

  server:
    build:
      context: ../..
      dockerfile: apps/game-server/Dockerfile
    environment:
      DATABASE_URL: postgres://exploding_kitty:exploding_kitty@postgres:5432/exploding_kitty
      AUTH_SECRET: local-compose-auth-secret-change-before-production
      DEV_AUTH_ENABLED: "true"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  exploding-kitty-postgres:
